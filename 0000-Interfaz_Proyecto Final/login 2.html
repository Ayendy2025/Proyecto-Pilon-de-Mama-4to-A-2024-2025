<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión - El Pilón de Mamá</title>
  <!-- Íconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="CSS/login 2.css"/>
</head>
<body>

  <div class="login-container">
    <h2 class="login-title">El Pilón de Mamá</h2>
    <p class="login-subtitle">Ingreso al sistema</p>

    <form action="#" method="POST">
      <!-- Correo o Usuario -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-user"></i></span>
        <input type="text" id="username" placeholder="Ingrese su usuario o correo" required>
      </div>
      <div id="username-error-container"></div>


      <!-- Contraseña -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
<i class="fa fa-eye-slash" id="toggleIcon" onclick="togglePassword()" style="cursor:pointer; margin-left:auto;"></i>
      </div>

    <div id="password-error-container"></div>


      <!-- Botón -->
      <button type="submit" class="button" id="loginBtn" onclick="login(event)">Iniciar sesión</button>
    </form>

    <!-- Enlaces secundarios -->
    <div class="extra-links">
       <p id="error" style="color: red;"></p>
  <p>¿No tienes cuenta? <a href="login 1.html">Regístrate</a></p>
    </div>
  </div>

<script src="JS/login 2.js"></script>

</body>
</html>
