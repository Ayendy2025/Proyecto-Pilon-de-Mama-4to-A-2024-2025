<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Temporizador</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #dbeafe 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 40px 30px 30px 30px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            display: inline-block;
        }
        h1 {
            color: #2563eb;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        #timer {
            font-size: 4em;
            font-weight: bold;
            color: #1e293b;
            margin: 28px 0 24px 0;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px #c7d2fe;
        }
        .inputs {
            margin-bottom: 10px;
        }
        input[type="number"] {
            width: 70px;
            font-size: 1.2em;
            text-align: center;
            border: 2px solid #93c5fd;
            border-radius: 8px;
            padding: 6px 0;
            margin: 0 6px;
            background: #f1f5f9;
            transition: border 0.2s;
        }
        input[type="number"]:focus {
            border: 2px solid #2563eb;
            outline: none;
        }
        label {
            font-size: 1.1em;
            color: #334155;
            margin: 0 4px;
        }
        .buttons {
            margin-top: 18px;
        }
        button {
            font-size: 1.1em;
            margin: 0 8px;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px #c7d2fe;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px) scale(1.04);
        }
        button:active {
            background: #1e40af;
        }
        @media (max-width: 500px) {
            .container {
                padding: 20px 8px 18px 8px;
            }
            #timer {
                font-size: 2.2em;
            }
            button {
                padding: 8px 12px;
                font-size: 1em;
            }
            input[type="number"] {
                width: 48px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Temporizador</h1>
        <div class="inputs">
            <input type="number" id="minutes" min="0" max="99" value="0">
            <label for="minutes">min</label>
            <input type="number" id="seconds" min="0" max="59" value="0">
            <label for="seconds">seg</label>
        </div>
        <div id="timer">00:00</div>
        <div class="buttons">
            <button onclick="startTimer()">Iniciar</button>
            <button onclick="pauseTimer()">Pausar</button>
            <button onclick="resetTimer()">Reiniciar</button>
        </div>
    </div>
    <script>
        let totalSeconds = 0;
        let interval = null;
        let paused = false;

        function updateDisplay() {
            let min = Math.floor(totalSeconds / 60);
            let sec = totalSeconds % 60;
            document.getElementById('timer').textContent =
                String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        function startTimer() {
            if (interval) return;
            if (!paused) {
                const min = parseInt(document.getElementById('minutes').value, 10) || 0;
                const sec = parseInt(document.getElementById('seconds').value, 10) || 0;
                totalSeconds = min * 60 + sec;
            }
            if (totalSeconds <= 0) return;
            interval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(interval);
                    interval = null;
                    alert('¡Tiempo terminado!');
                }
            }, 1000);
            paused = false;
            updateDisplay();
        }

        function pauseTimer() {
            if (interval) {
                clearInterval(interval);
                interval = null;
                paused = true;
            }
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = 0;
            paused = false;
            updateDisplay();
        }

        // Inicializar display
        updateDisplay();
    </script>
</body>
</html>
