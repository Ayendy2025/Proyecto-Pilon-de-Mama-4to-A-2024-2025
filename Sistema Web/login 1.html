<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - El Pilón de Mamá</title>
  <link rel="stylesheet" href="CSS/login 1.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div class="login-card">
    <div class="card-header">
      <img src="IMAGENES/Logo pilon de mama.jpg" alt="Logo del sistema">
      <h1>Crear Cuenta</h1>
    </div>
    <div class="card-body">
      <form onsubmit="registrarUsuario(event)">
        <div class="form-group">
          <label for="username">Nombre de usuario</label>
          <div class="input-container">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" name="username" required />
          </div>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-container">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" required />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <i class="fas fa-lock input-icon"></i>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" autocomplete="new-password" required />
              <i id="password-icon" class="fa fa-eye-slash password-toggle" onclick="togglePassword()"></i>
            </div>
          </div>
          <div id="password-hint" class="password-hint"></div>
        </div>
        <div class="form-group">
          <button type="submit" class="login-button">
            <span class="button-text">Crear cuenta</span>
            <i class="fas fa-spinner fa-spin button-spinner" style="display: none;"></i>
          </button>
        </div>
      </form>
    </div>
    <div class="extra-links">
      <p>¿Ya tienes una cuenta? <a href="login 2.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="JS/login 1.js"></script>
</body>
</html>
