<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla Definida</title>
    <!-- Bootstrap local -->
<link rel="stylesheet" href="bootstrap-5.3.6-dist/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="DataTables/datatables.min.css">
 <link rel="stylesheet" type="text/css" href="DataTables/datatables.css">



<style>
.table {
    border-collapse: collapse;
    width: 100% !important;
    margin: 20px auto;
}

        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        caption {
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>

<header>
    <h1 class="text-center text-align">Ejemplo de Tabla Definida</h1>
    <p class="text-center text-align">Esta es una tabla de ejemplo con datos ficticios.</p>
</header>
<body>

    <div style="height: 50px;"></div>

<div class="table-responsive">
    <table id="mitabla" class="table table-striped table-bordered">
        <caption>Ejemplo de Tabla Definida</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Ciudad</th>
            </tr>
        </thead>
        <tbodyo>
            <tr>
                <td>1</td>
                <td>Ana</td>
                <td>22</td>
                <td>Madrid</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Carlos</td>
                <td>25</td>
                <td>Barcelona</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Lucía</td>
                <td>28</td>
                <td>Valencia</td>
            </tr>
        </table>
    </table>
    </div>


    <script src="bootstrap-5.3.6-dist/js/bootstrap.bundle.min.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="DataTables/datatables.min.js"></script>
<script>
    $(document).ready(function() {
        $('#mitabla').DataTable();
    });
</script>
</body>
</html>
