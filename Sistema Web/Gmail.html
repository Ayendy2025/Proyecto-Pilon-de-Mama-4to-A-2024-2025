<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj Redondo con Brújula</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }
        #clock-canvas {
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="clock-canvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('clock-canvas');
        const ctx = canvas.getContext('2d');
        const radius = 200;

        function drawClock() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw outer circle
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // Draw compass directions
            const directions = ['N', 'E', 'S', 'O'];
            for (let i = 0; i < 4; i++) {
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(i * Math.PI / 2);
                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#d32f2f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(directions[i], 0, -radius + 40);
                ctx.restore();
            }

            // Draw compass needle (always pointing North)
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(-Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, 30);
            ctx.lineTo(0, -radius + 60);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#1976d2';
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, 30);
            ctx.lineTo(0, -radius + 80);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#d32f2f';
            ctx.stroke();
            ctx.restore();

            // Draw hour marks
            for (let i = 0; i < 12; i++) {
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(i * Math.PI / 6);
                ctx.beginPath();
                ctx.moveTo(0, -radius + 20);
                ctx.lineTo(0, -radius + 40);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#333';
                ctx.stroke();
                ctx.restore();
            }

            // Draw minute marks
            for (let i = 0; i < 60; i++) {
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(i * Math.PI / 30);
                ctx.beginPath();
                ctx.moveTo(0, -radius + 30);
                ctx.lineTo(0, -radius + 40);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#888';
                ctx.stroke();
                ctx.restore();
            }

            // Draw numbers
            ctx.font = '22px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let num = 1; num <= 12; num++) {
                let ang = (num - 3) * Math.PI / 6;
                ctx.fillText(num, radius + Math.cos(ang) * (radius - 65), radius + Math.sin(ang) * (radius - 65));
            }

            // Draw clock hands
            const now = new Date();
            let hour = now.getHours();
            let minute = now.getMinutes();
            let second = now.getSeconds();

            // Hour hand
            let hourAngle = ((hour % 12) + minute / 60) * Math.PI / 6;
            drawHand(hourAngle, radius - 100, 8, '#333');

            // Minute hand
            let minuteAngle = (minute + second / 60) * Math.PI / 30;
            drawHand(minuteAngle, radius - 60, 5, '#1976d2');

            // Second hand
            let secondAngle = second * Math.PI / 30;
            drawHand(secondAngle, radius - 50, 2, '#d32f2f');

            // Center circle
            ctx.beginPath();
            ctx.arc(radius, radius, 10, 0, 2 * Math.PI);
            ctx.fillStyle = '#1976d2';
            ctx.fill();
        }

        function drawHand(angle, length, width, color) {
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle - Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -length);
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
        }

        setInterval(drawClock, 1000);
        drawClock();
    </script>
</body>
</html>
